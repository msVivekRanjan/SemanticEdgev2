<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="seGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6d5ef5" />
      <stop offset="50%" stop-color="#3cc8ff" />
      <stop offset="100%" stop-color="#a0ff3c" />
    </linearGradient>
    <linearGradient id="seGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6d5ef5" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3cc8ff" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <!-- Background Rounded Base -->
  <rect width="40" height="40" rx="10" fill="#121318" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />

  <!-- Bounding Box Reticles (Top-Left, Top-Right, Bottom-Left, Bottom-Right) -->
  <path d="M 9 15 L 9 9 L 15 9" stroke="url(#seGrad)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 25 9 L 31 9 L 31 15" stroke="url(#seGrad)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 31 25 L 31 31 L 25 31" stroke="url(#seGrad)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 15 31 L 9 31 L 9 25" stroke="url(#seGrad)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Central Optical Vision Core / Neural Eye -->
  <circle cx="20" cy="20" r="5.5" stroke="#3cc8ff" stroke-width="1.8" fill="rgba(109, 94, 245, 0.25)" />
  <circle cx="20" cy="20" r="2.2" fill="#ffffff" />

  <!-- Radar scan ray / tracking point -->
  <circle cx="27" cy="13" r="1.5" fill="#a0ff3c" />
</svg>
