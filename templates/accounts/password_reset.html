{% extends "base.html" %}
{% load static %}
{% block title %}Reset Password — SemanticEdge{% endblock %}
{% block content %}
<div class="auth-container">
  <div class="auth-card">
    <h1 class="auth-card__logo" style="font-size: 20px;">Password Reset</h1>
    <p class="auth-card__subtitle">Enter your email address to receive password reset instructions.</p>
    <form method="post" class="auth-card__form">
      {% csrf_token %}
      <div class="auth-card__field">
        <label class="input-label" for="id_email">Email Address</label>
        <input type="email" name="email" id="id_email" class="input" required />
      </div>
      <button type="submit" class="btn btn--primary btn--full" style="margin-top: var(--space-md);">Send Reset Link</button>
    </form>
    <div style="margin-top: var(--space-xl); text-align: center;">
      <a href="{% url 'accounts:login' %}" class="text-link text-link--muted">← Back to Sign In</a>
    </div>
  </div>
</div>
{% endblock %}
