{% extends "base.html" %}
{% block title %}Reset Link Sent — SemanticEdge{% endblock %}
{% block content %}
<div class="auth-container">
  <div class="auth-card" style="text-align: center;">
    <h1 class="auth-card__logo" style="font-size: 20px;">Check Your Inbox</h1>
    <p class="auth-card__subtitle">If an account exists with that email, we've sent password reset instructions.</p>
    <a href="{% url 'accounts:login' %}" class="btn btn--ghost btn--full" style="margin-top: var(--space-lg);">Return to Sign In</a>
  </div>
</div>
{% endblock %}
